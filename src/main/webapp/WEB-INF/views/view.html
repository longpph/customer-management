<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer Details</title>
</head>

<body>
    <h3>Customer Details</h3>

    <p><a th:href="@{/customers}">Back to customer list</a></p>

    <div>
        <table border="1" cellpadding="5">
            <tr>
                <th>ID:</th>
                <td th:text="${customer.id}">1</td>
            </tr>
            <tr>
                <th>Name:</th>
                <td th:text="${customer.name}">John Doe</td>
            </tr>
            <tr>
                <th>Email:</th>
                <td th:text="${customer.email}">john@codegym.vn</td>
            </tr>
            <tr>
                <th>Address:</th>
                <td th:text="${customer.address}">Hanoi</td>
            </tr>
        </table>
    </div>

    <p>
        <a th:href="@{/customers/{id}/edit(id=${customer.id})}">Edit this customer</a>
    </p>
</body>

</html>
